{% extends "archimart/base.html" %}


{% block content %}

<div class="container">
        <nav class="breadcrumb">
            <ol class="breadcrumb-list" id="breadcrumbList"></ol>
        </nav>

        <div class="product-section">
            <div class="product-image-container">
                <img src="Image/placeholder.png" alt="Product Image" class="product-image" id="mainImage">
                <div class="image-dots" id="imageDots"></div>
            </div>

            <div class="product-details">
                <h1 class="product-title" id="productTitle">Loading...</h1>
                <div class="price-container">
                    <p class="product-price" id="productPrice">0 BDT</p>
                    <p class="product-discount-price" id="productDiscountPrice"></p>
                </div>
                <p class="product-description" id="productDescription">Loading description...</p>
                
                <div class="product-filters">
                    <div class="filter-group">
                        <label>Color:</label>
                        <div class="filter-circles" id="colorCircles"></div>
                    </div>
                    <div class="filter-group">
                        <label>Size:</label>
                        <div class="filter-circles" id="sizeCircles"></div>     
                    </div>
                    <div class="filter-group">
                        <label>Thickness:</label>
                        <div class="filter-circles" id="thicknessCircles"></div>
                    </div>
                </div>

                <h2 class="recommendation-title">Why Architects Recommend This</h2>
                <p class="recommendation-text" id="recommendationText">Loading recommendation...</p>

                <div class="action-buttons">
                    <button class="btn btn-add-cart" onclick="addToCart()">Add to Cart</button>
                    <button class="btn btn-buy-now" onclick="buyNow()">Buy Now</button>
                    <div class="quantity-selector">
                        <button class="quantity-btn" onclick="decreaseQuantity()">-</button>
                        <span class="quantity-display" id="quantity">1</span>
                        <button class="quantity-btn" onclick="increaseQuantity()">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="item-list">
            <h3>Specifications</h3>
            <ul id="specifications"></ul>
        </div>

        <div class="similar-products">
            <h3>Similar Products</h3>
            <div class="similar-grid" id="similarGrid"></div>
        </div>
    </div>


{% endblock content %}
