{% extends "dashboard/base.html" %} 
{% load crispy_forms_tags %} 



{% block content %}

<div class="content">
<!-- ✅ Working Dual Listbox CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap4-duallistbox@4.0.2/dist/bootstrap-duallistbox.min.css">

<!-- ✅ jQuery (must be loaded first) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- ✅ Working Dual Listbox JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap4-duallistbox@4.0.2/dist/jquery.bootstrap-duallistbox.min.js"></script>

  <h1>Welcome to Your Project</h1>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-8">
                <form method="POST" enctype="multipart/form-data" >
                    {% csrf_token %}
                    {{form | crispy}}
                    <input type="submit" class="btn btn-primary" value="Save">
                </form> 
            </div>
            <div class="col-md-4">
                <table class="table table-striped">
                    <thead>
                        <tr>
                        <th scope="col">#</th>
                        <th scope="col">Title</th>
                        <th scope="col">Edit</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in data %}
                            <tr>
                                <th scope="row">{{forloop.counter}}</th>
                                <td>{{s.name}}</td>
                                <td>
                                    <a href="{% url "admin_productimage" s.id %}" class="btn btn-secondary">Add Image</a>
                                    <a href="{% url "admin_specification" s.id %}" class="btn btn-secondary">Add Spec</a>
                                    <a href="{% url "admin_delete_product" s.id %}" class="btn btn-primary">Delete</a> 
                                
                                </td>
                            </tr>
                        {% endfor %}
                        
                    </tbody>
                    </table>
            </div>
        </div>
    </div>
</div>
<script>
  function refreshSimilarProducts(subId, currentId) {
    $.getJSON("{% url 'ajax_similar_products' %}", {
      subsubcategory_id: subId,
      current_id: currentId
    }, function (data) {
      const $select = $('select.dual-listbox');
      const selected = $select.val() || [];

      $select.empty();
      data.forEach(item => {
        const isSelected = selected.includes(String(item.id));
        const option = new Option(item.name, item.id, false, isSelected);
        $select.append(option);
      });

      $select.bootstrapDualListbox('refresh', true);
    });
  }

  $(function () {
    const currentId = "{{ form.instance.pk|default:'' }}";

    $('#id_subsubcategory').on('change', function () {
      const subId = $(this).val();
      refreshSimilarProducts(subId, currentId);
    });

    // Initial load if editing
    const initialSubId = $('#id_subsubcategory').val();
    if (initialSubId) {
      refreshSimilarProducts(initialSubId, currentId);
    }
  });
</script>




{% endblock content %}
