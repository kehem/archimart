{% extends "dashboard/base.html" %} 
{% load crispy_forms_tags %} 



{% block content %}

<div class="content">
<!-- Dual Listbox CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-duallistbox/4.0.2/bootstrap-duallistbox.min.css">

<!-- jQuery (must be loaded first) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<!-- Dual Listbox JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-duallistbox/4.0.2/jquery.bootstrap-duallistbox.min.js"></script>

  <h1>Welcome to Your Project</h1>
    <div class="container">
        <div class="row">
            <div class="col">
                <form method="POST" enctype="multipart/form-data" >
                    {% csrf_token %}
                    {{form | crispy}}
                    <input type="submit" class="btn btn-primary" value="Save">
                </form> 
            </div>
            <div class="col">
                <table class="table table-striped">
                    <thead>
                        <tr>
                        <th scope="col">#</th>
                        <th scope="col">Title</th>
                        <th scope="col">Edit</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in data %}
                            <tr>
                                <th scope="row">{{forloop.counter}}</th>
                                <td>{{s.name}}</td>
                                <td>
                                    <a href="{% url "admin_productimage" s.id %}" class="btn btn-secondary">Add Image</a>
                                    <a href="{% url "admin_specification" s.id %}" class="btn btn-secondary">Add Spec</a>
                                    <a href="{% url "admin_delete_product" s.id %}" class="btn btn-primary">Delete</a> 
                                
                                </td>
                            </tr>
                        {% endfor %}
                        
                    </tbody>
                    </table>
            </div>
        </div>
    </div>
</div>
<script>
  $(function () {
    $('select.dual-listbox').bootstrapDualListbox({
      nonSelectedListLabel: 'Available products',
      selectedListLabel: 'Similar products',
      moveOnSelect: false,
      preserveSelectionOnMove: 'moved',
      infoText: 'Showing all {0}',
      infoTextEmpty: 'No products available',
      filterPlaceHolder: 'Filter',
      selectorMinimalHeight: 200
    });
  });
</script>

{% endblock content %}
